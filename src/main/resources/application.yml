server: { port: 8080 }
health:
  policy:
    window-minutes: 60
    no-data-minutes: 15
    minimum-requests: 6
    degraded-error-rate: 0.10
    unhealthy-error-rate: 0.30
    degraded-timeout-rate: 0.10
    unhealthy-timeout-rate: 0.25
    degraded-p95-ms: 1000
    unhealthy-p95-ms: 5000
management.endpoints.web.exposure.include: health,info
