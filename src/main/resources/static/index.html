<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Integration Health Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            color: #252525;
            padding: 12px;
            font-size: 13px;
            background: #fff;
        }

        h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 12px;
        }

        .error {
            color: #c0392b;
            margin-bottom: 10px;
            display: none;
        }

        /* KPI */

        .kpi-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .kpi {
            flex: 1;
            min-width: 110px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 12px;
            text-align: center;
        }

        .kpi .val {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }

        .kpi .lbl {
            font-size: 10px;
            color: #666;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .healthy {
            color: #2ecc71;
        }

        .unhealthy {
            color: #e74c3c;
        }

        /* Chart */

        .chart-wrap,
        .tbl-wrap {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 14px;
        }

        .chart-wrap {
            padding: 12px;
        }

        .chart-title,
        .tbl-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .chart-title {
            margin-bottom: 8px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 6px;
        }

        .bar-label {
            width: 160px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            background: #eee;
            border-radius: 3px;
            height: 14px;
            position: relative;
            overflow: visible;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .4s ease;
        }

        .bar-pct {
            font-size: 10px;
            color: #666;
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }

        .bar-track:hover .bar-tooltip {
            display: block;
        }

        .bar-tooltip {
            display: none;
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 10;
        }

        /* Table */

        .tbl-wrap {
            overflow: auto;
        }

        .tbl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            padding: 6px 10px;
            text-align: left;
            background: #f1f1f1;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        td {
            padding: 6px 10px;
            border-top: 1px solid #ddd;
        }

        tr:hover td {
            background: #f5f5f5;
        }

        .sort-icon {
            margin-left: 3px;
            opacity: .5;
        }

        .badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-healthy {
            background: #d4f5e2;
            color: #1a7a42;
        }

        .badge-unhealthy {
            background: #fde8e8;
            color: #c0392b;
        }

        .reason-tag {
            display: inline-block;
            background: #f1f1f1;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 9px;
            margin: 1px;
            color: #666;
        }
    </style>

</head>

<body>

<h2>Integration Health Dashboard</h2>

<p class="meta" id="meta">
    Loading health data...
</p>

<p class="error" id="error"></p>

<!-- KPI Cards -->

<div class="kpi-row" id="kpiRow"></div>


<!-- Error Rate Chart -->

<div class="chart-wrap">

    <div class="chart-title">
        Error Rate by Integration
    </div>

    <div id="barChart"></div>

</div>


<!-- Integration Table -->

<div class="tbl-wrap">

    <div class="tbl-header">
        <span class="tbl-title">
            Integration Details
        </span>
    </div>

    <table>

        <thead>
        <tr>

            <th data-col="integration">
                Integration
                <span class="sort-icon">↕</span>
            </th>

            <th data-col="status">
                Status
                <span class="sort-icon">↕</span>
            </th>

            <th data-col="requestCount">
                Requests
                <span class="sort-icon">↕</span>
            </th>

            <th data-col="failureCount">
                Failures
                <span class="sort-icon">↕</span>
            </th>

            <th data-col="timeoutCount">
                Timeouts
                <span class="sort-icon">↕</span>
            </th>

            <th data-col="errorRate">
                Error Rate
                <span class="sort-icon">↕</span>
            </th>

            <th data-col="timeoutRate">
                Timeout Rate
                <span class="sort-icon">↕</span>
            </th>

            <th>
                Reasons
            </th>

        </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

</div>


<script>

    /*
     * Spring Boot REST API
     */
    const API_URL = '/api/v1/integrations/health';

    let integrations = [];

    let sortCol = 'errorRate';
    let sortAsc = false;


    /*
     * Utility methods
     */

    const esc = value =>
        String(value ?? '').replace(
            /[&<>'"]/g,
            c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[c])
        );

    const num = value => Number(value) || 0;


    /*
     * Render complete dashboard
     */

    function render() {

        renderKpis();
        renderChart();
        renderTable();

        document.getElementById('meta').textContent =
            `Last refreshed: ${new Date().toLocaleString()}
             | ${integrations.length} integrations`;
    }


    /*
     * KPI Cards
     */

    function renderKpis() {

        const total = integrations.length;

        const healthy =
            integrations.filter(
                d => d.status === 'HEALTHY'
            ).length;

        const unhealthy =
            total - healthy;

        const avgErrorRate =
            total
                ? (
                    integrations.reduce(
                        (sum, d) =>
                            sum + num(d.errorRate),
                        0
                    ) / total * 100
                  ).toFixed(1)
                : '0.0';

        const totalRequests =
            integrations.reduce(
                (sum, d) =>
                    sum + num(d.requestCount),
                0
            );

        const totalFailures =
            integrations.reduce(
                (sum, d) =>
                    sum + num(d.failureCount),
                0
            );


        const kpis = [

            {
                value: total,
                label: 'Total Integrations',
                className: ''
            },

            {
                value: healthy,
                label: 'Healthy',
                className: 'healthy'
            },

            {
                value: unhealthy,
                label: 'Unhealthy',
                className: 'unhealthy'
            },

            {
                value: avgErrorRate + '%',
                label: 'Avg Error Rate',
                className:
                    Number(avgErrorRate) > 20
                        ? 'unhealthy'
                        : 'healthy'
            },

            {
                value: totalRequests,
                label: 'Total Requests',
                className: ''
            },

            {
                value: totalFailures,
                label: 'Total Failures',
                className:
                    totalFailures > 0
                        ? 'unhealthy'
                        : 'healthy'
            }

        ];


        document.getElementById('kpiRow').innerHTML =
            kpis.map(kpi => `

                <div class="kpi">

                    <div class="val ${kpi.className}">
                        ${kpi.value}
                    </div>

                    <div class="lbl">
                        ${kpi.label}
                    </div>

                </div>

            `).join('');
    }


    /*
     * Error Rate Chart
     */

    function renderChart() {

        const sorted =
            [...integrations]
                .sort(
                    (a, b) =>
                        num(b.errorRate)
                        - num(a.errorRate)
                );


        document.getElementById('barChart').innerHTML =

            sorted.map(d => {

                const percentage =
                    (num(d.errorRate) * 100)
                        .toFixed(1);

                const color =
                    d.status === 'HEALTHY'
                        ? '#2ecc71'
                        : '#e74c3c';


                return `

                <div class="bar-row">

                    <div
                        class="bar-label"
                        title="${esc(d.integration)}">

                        ${esc(d.integration)}

                    </div>


                    <div class="bar-track">

                        <div
                            class="bar-fill"
                            style="
                                width:${Math.min(
                                    Number(percentage),
                                    100
                                )}%;
                                background:${color}
                            ">
                        </div>

                        <div class="bar-tooltip">
                            ${percentage}% error rate
                        </div>

                    </div>


                    <div class="bar-pct">
                        ${percentage}%
                    </div>

                </div>

                `;

            }).join('');
    }


    /*
     * Integration Detail Table
     */

    function renderTable() {

        const rows =
            [...integrations]
                .sort((a, b) => {

                    let av = a[sortCol];
                    let bv = b[sortCol];

                    if (typeof av === 'string') {

                        av = av.toLowerCase();

                        bv =
                            String(bv ?? '')
                                .toLowerCase();
                    }

                    if (av === bv) {
                        return 0;
                    }

                    return sortAsc
                        ? (av > bv ? 1 : -1)
                        : (av < bv ? 1 : -1);

                });


        document.getElementById('tableBody').innerHTML =

            rows.map(d => {

                const healthy =
                    d.status === 'HEALTHY';

                const reasons =
                    Array.isArray(d.reasons)
                        ? d.reasons
                        : [];


                return `

                <tr>

                    <td>
                        ${esc(d.integration)}
                    </td>

                    <td>

                        <span class="badge
                            ${healthy
                                ? 'badge-healthy'
                                : 'badge-unhealthy'}">

                            ${esc(d.status)}

                        </span>

                    </td>

                    <td>
                        ${num(d.requestCount)}
                    </td>

                    <td>
                        ${num(d.failureCount)}
                    </td>

                    <td>
                        ${num(d.timeoutCount)}
                    </td>

                    <td>
                        ${(num(d.errorRate) * 100)
                            .toFixed(1)}%
                    </td>

                    <td>
                        ${(num(d.timeoutRate) * 100)
                            .toFixed(1)}%
                    </td>

                    <td>

                        ${reasons.map(reason => `

                            <span class="reason-tag">
                                ${esc(reason)}
                            </span>

                        `).join('')}

                    </td>

                </tr>

                `;

            }).join('');
    }


    /*
     * Fetch health data from Spring Boot API
     */

    async function loadHealth() {

        const error =
            document.getElementById('error');

        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        headers: {
                            Accept: 'application/json'
                        },

                        cache: 'no-store'
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}
                     ${response.statusText}`
                );
            }


            const body =
                await response.json();


            /*
             * Supports:
             *
             * [...]
             *
             * OR
             *
             * {
             *    "integrations": [...]
             * }
             *
             * OR
             *
             * {
             *    "data": [...]
             * }
             */

            if (Array.isArray(body)) {

                integrations = body;

            } else if (
                Array.isArray(body.integrations)
            ) {

                integrations =
                    body.integrations;

            } else if (
                Array.isArray(body.data)
            ) {

                integrations =
                    body.data;

            } else {

                integrations = [];
            }


            error.style.display =
                'none';

            render();

        }
        catch (exception) {

            console.error(
                'Failed to load health data',
                exception
            );

            error.textContent =
                `Unable to load ${API_URL}: ` +
                exception.message;

            error.style.display =
                'block';

            document.getElementById('meta')
                .textContent =
                'Health data unavailable';
        }
    }


    /*
     * Column sorting
     */

    document
        .querySelectorAll(
            'th[data-col]'
        )
        .forEach(th => {

            th.addEventListener(
                'click',
                () => {

                    const column =
                        th.dataset.col;

                    if (sortCol === column) {

                        sortAsc =
                            !sortAsc;

                    } else {

                        sortCol =
                            column;

                        sortAsc =
                            true;
                    }

                    renderTable();
                }
            );

        });


    /*
     * Initial load
     */

    loadHealth();


    /*
     * Refresh health information every 5 seconds
     */

    setInterval(
        loadHealth,
        5000
    );

</script>

</body>
</html>
